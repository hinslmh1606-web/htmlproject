    <style>
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            border: 5px solid #e32e2e;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
            padding: 16px;
            gap: 10px;
            background: #090979;
            background: linear-gradient(69deg,rgba(9, 9, 121, 1) 21%, rgba(7, 54, 151, 1) 56%, rgba(3, 144, 211, 1) 81%, rgb(8, 186, 11) 100%);
        }
        .card img{
            width: 100px;
            height: 100px;
            border: 2px solid #ccc;
            border-radius: 50%;
        }
        .card .person-detail {
            width: 100%;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;

        }
        .card p {
            font-size: 12px;
            margin: 5px 10px;
        }
    </style>
